[project]
name = "drone-swarm"
version = "0.1.0"
description = "Production-grade Drone Swarm Framework"
readme = "README.md"
requires-python = ">=3.8"

dependencies = [
    "dronekit>=2.9.2",
    "future>=1.0.0",
    "loguru>=0.7.3",
    "prompt-toolkit>=3.0.52",
    "pymavlink>=2.4.49",
    "pyyaml>=6.0.3",
    "rich>=13.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swarm"]
